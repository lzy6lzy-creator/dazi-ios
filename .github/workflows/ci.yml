name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dazi-server
    env:
      DATABASE_URL: postgresql+asyncpg://dazi:ci-password@localhost:5432/dazi_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-not-a-production-secret
      ADMIN_TOKEN: ci-only-not-a-production-admin-token
      AGENT_API_KEY: ci-placeholder-never-used-for-model-calls
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dazi
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: dazi_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U dazi -d dazi_ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dazi-server/requirements*.txt
      - name: Install runtime and test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check
      - name: Backend regression tests
        run: |
          mkdir -p ../artifacts
          python -m pytest -q --junitxml=../artifacts/backend.xml
      - name: Fresh database migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: API and cross-process smoke tests
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../artifacts/api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"; wait "$api_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready; then break; fi
            sleep 1
          done
          python -m scripts.smoke_runtime --ws-url ws://127.0.0.1:8000/ws
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: artifacts/
          retention-days: 7

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Static regression tests
        run: python3 -m unittest discover tests
      - name: XCTest and UI tests
        run: |
          mkdir -p artifacts
          xcodebuild test -project dazi.xcodeproj -scheme dazi -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -parallel-testing-enabled NO \
            -resultBundlePath artifacts/ios-tests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-test-results
          path: artifacts/
          retention-days: 7
